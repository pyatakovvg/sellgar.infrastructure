name: Test application

on:
  workflow_call:
    inputs:
      source-revision:
        type: string
        required: true
    secrets:
      SUBMODULES_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-revision }}
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Run tests
        run: docker build --platform linux/amd64 --target tests --progress plain .
