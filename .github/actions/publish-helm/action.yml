name: Publish Helm release
description: Publish a verified image digest with its matching environment values to GHCR
inputs:
  environment:
    description: dev or prod
    required: true
  source-commit:
    description: Source commit of the verified image
    required: true
  image-digest:
    description: Published sha256 image digest
    required: true
  release-name:
    description: Existing Kubernetes release name
    required: true
  github-token:
    description: Repository GITHUB_TOKEN with packages write permission
    required: true
outputs:
  chart-name:
    value: ${{ steps.package.outputs.chart_name }}
    description: Published Helm chart name
  chart-version:
    value: ${{ steps.package.outputs.chart_version }}
    description: Immutable Helm chart version
runs:
  using: composite
  steps:
    - name: Validate publication trigger
      shell: bash
      env:
        TARGET_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        case "$TARGET_ENVIRONMENT:$GITHUB_EVENT_NAME:$GITHUB_REF" in
          dev:push:refs/heads/development|prod:workflow_dispatch:refs/heads/master) ;;
          *) printf 'Unsupported Helm publication trigger.\n' >&2; exit 1 ;;
        esac

    - name: Checkout matching service configuration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.source-commit }}
        path: helm-source
        sparse-checkout: helm
        persist-credentials: false

    - name: Install pinned Helm and YAML tooling
      shell: bash
      run: |
        tools="$RUNNER_TEMP/helm-tools"
        mkdir -p "$tools"
        curl --fail --silent --show-error --location --retry 3 \
          https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz -o "$tools/helm.tar.gz"
        printf '%s  %s\n' d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983 "$tools/helm.tar.gz" | sha256sum --check
        tar -xzf "$tools/helm.tar.gz" -C "$tools" linux-amd64/helm
        printf '%s\n' "$tools/linux-amd64" >> "$GITHUB_PATH"
        python3 -m venv "$tools/python"
        "$tools/python/bin/pip" --disable-pip-version-check install PyYAML==6.0.3

    - name: Check release package guarantees
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        "$RUNNER_TEMP/helm-tools/python/bin/python" -B -m unittest discover \
          -s "$ACTION_PATH" -p 'test_*.py'

    - name: Package verified release
      id: package
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        TARGET_ENVIRONMENT: ${{ inputs.environment }}
        RELEASE_NAME: ${{ inputs.release-name }}
      run: |
        "$RUNNER_TEMP/helm-tools/python/bin/python" "$ACTION_PATH/package.py" \
          --chart "$ACTION_PATH/../../../charts/application" \
          --service "$GITHUB_WORKSPACE/helm-source" \
          --destination "$RUNNER_TEMP/helm-release" \
          --repository "${GITHUB_REPOSITORY,,}" \
          --commit "$SOURCE_COMMIT" --digest "$IMAGE_DIGEST" \
          --environment "$TARGET_ENVIRONMENT" \
          --version "0.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
          --release-name "$RELEASE_NAME"

    - name: Publish immutable Helm package
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.github-token }}
        CHART_PACKAGE: ${{ steps.package.outputs.chart_package }}
        CHART_NAME: ${{ steps.package.outputs.chart_name }}
        CHART_VERSION: ${{ steps.package.outputs.chart_version }}
        HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
      run: |
        printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        helm push "$CHART_PACKAGE" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm"
        printf '### Published deployment package\n\n`oci://ghcr.io/%s/helm/%s:%s`\n\nArgo CD tracks this environment package; no infrastructure Git update is needed. Publication is not a rollout health check.\n' \
          "${GITHUB_REPOSITORY_OWNER,,}" "$CHART_NAME" "$CHART_VERSION" >> "$GITHUB_STEP_SUMMARY"

    - name: Save published Helm package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: helm-release-${{ inputs.environment }}
        path: ${{ steps.package.outputs.chart_package }}
        if-no-files-found: error
        retention-days: 90
