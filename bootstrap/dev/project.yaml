apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sellgar-gitops
  namespace: argocd
spec:
  description: Управление описаниями приложений dev
  sourceRepos:
    - https://github.com/pyatakovvg/sellgar.infrastructure.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
