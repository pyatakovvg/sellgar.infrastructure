apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sellgar-dev
  namespace: argocd
spec:
  project: sellgar-gitops
  source:
    repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: development
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
