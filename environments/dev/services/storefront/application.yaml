apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-storefront
  namespace: argocd
  annotations:
    sellgar.io/image-source-commit: fd7b411a925cd383dce6b5efa3a7b0bdf1ce990a
    sellgar.io/image-ci-run: '44593933665'
spec:
  project: sellgar-dev
  sources:
  - repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: f008cf0847ce0476c51c68fff64d2a234cf4f8d4
    path: charts/application
    helm:
      releaseName: storefront
      valueFiles:
      - $app/helm/values.app.yaml
      - $app/helm/dev/values.yaml
      parameters:
      - name: image.repository
        value: ghcr.io/pyatakovvg/sellgar.ui.desktop
      - name: image.digest
        value: sha256:d337efde802a170eb69dad173ba0067d4d83885850f075c06f89f25d1d16dd40
  - repoURL: https://github.com/pyatakovvg/sellgar.ui.desktop.git
    targetRevision: 5c5f4fd977a58e5f8e5073bcff1df1604dbb23e8
    ref: app
  destination:
    server: https://kubernetes.default.svc
    namespace: sellgar-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
