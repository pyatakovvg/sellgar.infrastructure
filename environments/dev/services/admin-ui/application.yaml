apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-admin-ui
  namespace: argocd
  annotations:
    sellgar.io/image-source-commit: bcfbcea9ca44663235f9cd6e01713e050a6ad83f
    sellgar.io/image-ci-run: '44612347757'
spec:
  project: sellgar-dev
  sources:
  - repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: 98c9c6b226c877ec2ae35d6b12aaacd98eea9d9d
    path: charts/application
    helm:
      releaseName: admin-ui
      valueFiles:
      - $app/helm/values.app.yaml
      - $app/helm/dev/values.yaml
      parameters:
      - name: image.repository
        value: ghcr.io/pyatakovvg/sellgar.ui.admin
      - name: image.digest
        value: sha256:6e2a5b074898ebf646de8234cc649f522bbd8b7019d29017eb7418f243c5febe
  - repoURL: https://github.com/pyatakovvg/sellgar.ui.admin.git
    targetRevision: bcfbcea9ca44663235f9cd6e01713e050a6ad83f
    ref: app
  destination:
    server: https://kubernetes.default.svc
    namespace: sellgar-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
