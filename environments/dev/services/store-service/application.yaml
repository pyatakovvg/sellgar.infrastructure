apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-store-service
  namespace: argocd
  annotations:
    sellgar.io/image-source-commit: dab8349b061194c6a2f994208065e252d60ad4ef
    sellgar.io/image-ci-run: '44618902898'
spec:
  project: sellgar-dev
  sources:
  - repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: 98c9c6b226c877ec2ae35d6b12aaacd98eea9d9d
    path: charts/application
    helm:
      releaseName: store-service
      valueFiles:
      - $app/helm/values.app.yaml
