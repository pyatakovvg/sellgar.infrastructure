apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-admin-gateway
  namespace: argocd
  annotations:
    sellgar.io/image-source-commit: 5b4c43afb951c49ff415bcb07161277f738e5d2e
    sellgar.io/image-ci-run: '44597283705'
spec:
  project: sellgar-dev
  sources:
  - repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: 98c9c6b226c877ec2ae35d6b12aaacd98eea9d9d
    path: charts/application
    helm:
      releaseName: admin-gateway
      valueFiles:
      - $app/helm/values.app.yaml
      - $app/helm/dev/values.yaml
      parameters:
      - name: image.repository
        value: ghcr.io/pyatakovvg/sellgar.admin.gateway
      - name: image.digest
        value: sha256:cc4d0350e5e6ab641fe1923a129e25e475e08a7f4c04520d3a46a605ff44253a
  - repoURL: https://github.com/pyatakovvg/sellgar.admin.gateway.git
    targetRevision: 5b4c43afb951c49ff415bcb07161277f738e5d2e
    ref: app
  destination:
    server: https://kubernetes.default.svc
    namespace: sellgar-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
