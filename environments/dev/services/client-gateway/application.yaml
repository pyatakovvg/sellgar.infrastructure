apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-client-gateway
  namespace: argocd
  annotations:
    sellgar.io/image-source-commit: 35ae7134761ffa33af3fda27a23358a5d842b04b
    sellgar.io/image-ci-run: '44597284032'
spec:
  project: sellgar-dev
  sources:
  - repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: 98c9c6b226c877ec2ae35d6b12aaacd98eea9d9d
    path: charts/application
    helm:
      releaseName: client-gateway
      valueFiles:
      - $app/helm/values.app.yaml
      - $app/helm/dev/values.yaml
      parameters:
      - name: image.repository
        value: ghcr.io/pyatakovvg/sellgar.client.gateway
      - name: image.digest
        value: sha256:84a0caf8c08678c18011af60f8a635ae7dd85dde2d2e3a132886d5e9cce46f23
  - repoURL: https://github.com/pyatakovvg/sellgar.client.gateway.git
    targetRevision: 35ae7134761ffa33af3fda27a23358a5d842b04b
    ref: app
  destination:
    server: https://kubernetes.default.svc
    namespace: sellgar-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
