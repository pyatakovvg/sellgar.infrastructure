apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-client-gateway
  namespace: argocd
spec:
  project: sellgar-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sellgar-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  source:
    repoURL: ghcr.io/pyatakovvg/helm
    chart: sellgar-client-gateway-dev
    targetRevision: '>=0.0.0'
    helm:
      releaseName: client-gateway
