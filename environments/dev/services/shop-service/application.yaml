apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-shop-service
  namespace: argocd
  annotations:
    sellgar.io/image-source-commit: bbe16ca9b2c757951dcedd32d80d249ec2a54348
    sellgar.io/image-ci-run: '44609854076'
spec:
  project: sellgar-dev
  sources:
  - repoURL: https://github.com/pyatakovvg/sellgar.infrastructure.git
    targetRevision: 98c9c6b226c877ec2ae35d6b12aaacd98eea9d9d
    path: charts/application
    helm:
      releaseName: shop-service
      valueFiles:
      - $app/helm/values.app.yaml
      - $app/helm/dev/values.yaml
