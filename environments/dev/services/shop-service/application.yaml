      - name: image.repository
        value: ghcr.io/pyatakovvg/sellgar.shop.service
      - name: image.digest
        value: sha256:eeff8f625e4057b2488e9574d205149e48cc878fe7c30119cafddc52d623ec0b
  - repoURL: https://github.com/pyatakovvg/sellgar.shop.service.git
    targetRevision: bbe16ca9b2c757951dcedd32d80d249ec2a54348
    ref: app
  destination:
    server: https://kubernetes.default.svc
    namespace: sellgar-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
