apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sellgar-dev-tls
  namespace: sellgar-dev
spec:
  secretName: sellgar-dev-tls
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: Issuer
  dnsNames:
  - dev.sellgar.ru
  - admin.dev.sellgar.ru
  - cdn.dev.sellgar.ru
