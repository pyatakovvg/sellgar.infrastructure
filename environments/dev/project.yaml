apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sellgar-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  description: Приложения Sellgar в локальной dev-среде
  sourceRepos:
  - ghcr.io/pyatakovvg/helm
  - https://github.com/sellgar/sellgar.infrastructure.git
  - https://github.com/sellgar/sellgar.ui.admin.git
  - https://github.com/sellgar/sellgar.ui.desktop.git
  - https://github.com/sellgar/sellgar.admin.gateway.git
  - https://github.com/sellgar/sellgar.client.gateway.git
  - https://github.com/sellgar/sellgar.socket.gateway.git
  - https://github.com/sellgar/sellgar.identity.service.git
  - https://github.com/sellgar/sellgar.shop.service.git
  - https://github.com/sellgar/sellgar.product.service.git
  - https://github.com/sellgar/sellgar.store.service.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: sellgar-dev
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: apps
    kind: Deployment
  - group: networking.k8s.io
    kind: Ingress
  - group: batch
    kind: Job
  - group: traefik.io
    kind: Middleware
