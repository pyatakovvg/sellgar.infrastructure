{{- if eq .Values.workload "application" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "application.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.applicationPort }}
      targetPort: http
{{- end }}
