{{- range .Values.configmaps }}
{{- if .enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "configmaps[].nameOverride is required" .nameOverride }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "application.labels" $ | nindent 4 }}
data:
  {{ required "configmaps[].filename is required" .filename | quote }}: |
    {{- required "configmaps[].data is required" .data | nindent 4 }}
{{- end }}
{{- end }}
