{{- if or .Values.migration.enabled (eq .Values.workload "migration") }}
{{- $image := .Values.image }}
{{- if or .Values.migration.image.repository .Values.migration.image.digest }}
{{- $image = .Values.migration.image }}
{{- if not $image.repository }}
{{- fail "migration.image.repository is required for a separate migration image" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $image.digest) }}
{{- fail "migration.image.digest must be a sha256 digest from CI" }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}{{ if ne .Values.workload "migration" }}-migration{{ end }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  {{- if ne .Values.workload "migration" }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    {{- with .Values.sourceRevision }}
    metadata:
      annotations:
        sellgar.io/source-revision: {{ . | quote }}
    {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migration
          image: {{ printf "%s@%s" $image.repository $image.digest | quote }}
          {{- with .Values.migration.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with .Values.migration.args }}
          args: {{ toJson . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "application.env" (dict "Values" (dict "env" (default .Values.env .Values.migration.env))) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.volumeMounts .Values.environmentFile.enabled }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.environmentFile.enabled }}
            - name: environment-file
              mountPath: {{ .Values.environmentFile.mountPath | quote }}
              subPath: {{ .Values.environmentFile.filename | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.environmentFile.enabled }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.environmentFile.enabled }}
        - name: environment-file
          configMap:
            name: {{ include "application.environmentName" . }}
        {{- end }}
      {{- end }}
{{- end }}
