k3s_cluster:
  children:
    server:
      hosts:
        sellgar-k3s:
          ansible_host: 192.168.122.10
    agent:
      hosts: {}
  vars:
    ansible_user: sellgar
    ansible_become: true
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.local/share/sellgar/vm/sellgar-k3s/id_ed25519"
    ansible_ssh_common_args: "-F /dev/null -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.local/share/sellgar/vm/sellgar-k3s/known_hosts"
    k3s_version: v1.37.2+k3s1
    api_endpoint: 192.168.122.10
    k3s_server_config_mode: '0600'
    kubeconfig: "{{ lookup('env', 'HOME') }}/.local/share/sellgar/vm/sellgar-k3s/kubeconfig"
    server_config_yaml: |
      node-name: sellgar-k3s
      node-ip: 192.168.122.10
      advertise-address: 192.168.122.10
      tls-san:
      - 192.168.122.10
      cluster-init: true
      secrets-encryption: true
      write-kubeconfig-mode: '0600'
    cluster_context: sellgar-local
localhost:
  hosts:
    control:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ansible_remote_tmp: /tmp/sellgar-ansible
      kubernetes_namespace: sellgar-dev
      kubeconfig_path: "{{ lookup('env', 'HOME') }}/.local/share/sellgar/vm/sellgar-k3s/kubeconfig"
      kubectl_path: "{{ lookup('env', 'HOME') }}/.local/share/sellgar/vm/sellgar-k3s/bin/kubectl"
