- name: Check whether the named credential already exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ secret_namespace | default(kubernetes_namespace) }}"
    name: "{{ secret_name }}"
  register: existing_secret
  no_log: true

- name: Create a missing credential
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ secret_name }}"
        namespace: "{{ secret_namespace | default(kubernetes_namespace) }}"
        labels: "{{ secret_labels | default({}) }}"
      type: "{{ secret_type | default('Opaque') }}"
      stringData: "{{ secret_values }}"
  when: existing_secret.resources | length == 0
  no_log: true
